---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeassistant

labels:
  - pairs:
      app: homeassistant
    includeSelectors: true

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - homeassistant-deployment.yaml
  - homeassistant-service.yaml
