---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: homeassistant
  labels:
    app: homeassistant
    component: postgres
type: Opaque
stringData:
  POSTGRES_USER: homeassistant
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: homeassistant
  # Connection URL for Home Assistant recorder configuration
  # postgresql://homeassistant:changeme@postgres.homeassistant.svc.cluster.local:5432/homeassistant?client_encoding=utf8
